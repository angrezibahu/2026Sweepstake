name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # The results updater commits with the automatic GITHUB_TOKEN, and pushes made
  # with that token deliberately do NOT fire other workflows' `push` triggers.
  # `workflow_run` is not subject to that rule, so it lets a fresh results commit
  # actually redeploy the site instead of leaving Pages frozen on the last human push.
  workflow_run:
    workflows: ["Update match results"]
    types: [completed]
  # Safety net for the rest of the tournament: the Pages backend occasionally
  # rejects a deployment ("Deployment failed, try again later"), and GitHub can
  # delay or skip cron firings of the results updater. Redeploying whatever is
  # on main once an hour means a failed deploy can never leave the live site
  # stale for more than about an hour.
  schedule:
    - cron: "45 * 6-19 7 *"   # hourly at :45, 6-19 July
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # On a workflow_run trigger, only deploy if the results update succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # The Pages backend intermittently answers "Deployment failed, try again
      # later." (~a quarter of runs during the tournament). Doing exactly that
      # inline - up to two retries with a pause - stops a transient blip from
      # freezing the site until the next results commit hours later.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (first retry)
        id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before the final deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (final attempt)
        id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
